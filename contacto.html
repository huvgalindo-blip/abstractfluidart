<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto — AbstractFluidArt</title>
  <meta name="description" content="Contacta con el estudio de Cristina Pacheco." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <header id="site-header"></header>

  <main class="container" style="padding: 3rem 1.25rem; max-width: 640px;">
    <h1>Contacto</h1>
    <p>¿Tienes una consulta sobre una obra, encargos o envíos? Escríbenos.</p>

    <form id="contact-form" class="checkout-form">
      <input required name="name" placeholder="Tu nombre">
      <input required name="email" type="email" placeholder="Tu email">
      <input name="subject" placeholder="Asunto (opcional)">
      <textarea required name="body" rows="5" placeholder="Mensaje"></textarea>
      <button class="btn btn--primary">Enviar</button>
    </form>

    <p style="margin-top: 2rem;">
      También puedes escribir directamente por
      <a href="https://wa.me/34627365261" target="_blank" rel="noopener" style="color: var(--color-accent);">WhatsApp</a>.
    </p>
  </main>

  <footer id="site-footer"></footer>

  <script type="module" src="/js/contacto.js"></script>
</body>
</html>
