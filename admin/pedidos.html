<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedidos · Admin · AbstractFluidArt</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />

  <style>
    body { background: #f5f3ef; }
    .admin-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .admin-side { background: #1a1a1a; color: #e5e0d8; padding: 2rem 1.2rem; }
    .admin-side__brand { font-family: var(--font-display); font-size: 1.4rem; font-weight: 600; color: #faf7f2; margin-bottom: 0.2rem; }
    .admin-side__sub { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; color: #c2410c; margin-bottom: 2rem; }
    .admin-side__nav { display: grid; gap: 0.3rem; }
    .admin-side__nav a { display: block; padding: 0.65rem 0.9rem; border-radius: 8px; font-size: 0.9rem; color: #d4cec4; }
    .admin-side__nav a:hover { background: #2a2a2a; color: #fff; }
    .admin-side__nav a.active { background: #c2410c; color: #fff; font-weight: 600; }
    .admin-side__logout { margin-top: 2rem; font-size: 0.85rem; color: #9b9489; cursor: pointer; background: none; border: none; padding: 0; }

    .admin-main { padding: 2.5rem; max-width: 1300px; }
    .admin-title { font-family: var(--font-display); font-size: 2rem; margin: 0 0 0.3rem; }
    .admin-sub { color: var(--color-muted); margin-bottom: 2rem; font-size: 0.95rem; }

    /* Filtros */
    .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .filter-btn {
      padding: 0.55rem 1rem; border-radius: 999px;
      border: 1px solid #e5e0d8; background: #fff;
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover { background: #efece5; }
    .filter-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

    /* Tabla */
    .orders-table {
      width: 100%; background: #fff; border-radius: 12px; overflow: hidden;
      border-collapse: collapse; box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .orders-table th, .orders-table td {
      text-align: left; padding: 0.9rem 1.1rem;
      border-bottom: 1px solid #efece5; font-size: 0.9rem; vertical-align: middle;
    }
    .orders-table th {
      background: #f9f7f3; font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--color-muted); font-weight: 600;
    }
    .orders-table tr:last-child td { border-bottom: none; }
    .orders-table tr:hover td { background: #fcfbf8; cursor: pointer; }

    .status-pill {
      display: inline-block; padding: 0.2rem 0.65rem;
      border-radius: 999px; font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .status-pending   { background: #fef3c7; color: #92400e; }
    .status-paid      { background: #dcfce7; color: #166534; }
    .status-shipped   { background: #dbeafe; color: #1e40af; }
    .status-delivered { background: #e0e7ff; color: #3730a3; }
    .status-cancelled { background: #fee2e2; color: #991b1b; }

    .empty { background: #fff; border-radius: 12px; padding: 3rem; text-align: center; color: var(--color-muted); }

    /* Detalle (expandible bajo la fila) */
    .order-detail {
      background: #f9f7f3;
      padding: 1.2rem 1.5rem;
      font-size: 0.9rem;
      border-radius: 8px;
      margin: 0.5rem 0;
    }
    .order-detail h4 {
      margin: 0 0 0.6rem;
      font-family: var(--font-display);
      font-size: 1.05rem;
    }
    .order-detail .items-list {
      list-style: none; padding: 0; margin: 0 0 1rem;
    }
    .order-detail .items-list li {
      display: flex; justify-content: space-between;
      padding: 0.4rem 0; border-bottom: 1px dashed #e5e0d8;
    }
    .order-detail .items-list li:last-child { border-bottom: none; }
    .order-detail .meta-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 2rem;
      margin-bottom: 1rem;
    }
    .order-detail .meta-grid div span {
      display: block; font-size: 0.75rem; color: var(--color-muted);
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .status-actions {
      display: flex; gap: 0.5rem; flex-wrap: wrap;
      padding-top: 1rem; border-top: 1px solid #e5e0d8;
    }
    .status-actions button {
      padding: 0.5rem 1rem; border-radius: 6px; border: 1px solid #e5e0d8;
      background: #fff; cursor: pointer; font-size: 0.85rem; font-weight: 600;
    }
    .status-actions button:hover { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .status-actions button:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 900px) {
      .admin-shell { grid-template-columns: 1fr; }
      .admin-side { padding: 1.2rem; }
      .admin-main { padding: 1.5rem; }
      .orders-table th:nth-child(3),
      .orders-table td:nth-child(3),
      .orders-table th:nth-child(4),
      .orders-table td:nth-child(4) { display: none; }
      .order-detail .meta-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-side">
      <div class="admin-side__brand">AbstractFluidArt</div>
      <div class="admin-side__sub">Admin</div>
      <nav class="admin-side__nav">
        <a href="/admin/dashboard.html">🏠 Dashboard</a>
        <a href="/admin/obras.html">🖼️ Obras</a>
        <a href="/admin/categorias.html">📂 Categorías</a>
        <a href="/admin/pedidos.html" class="active">📦 Pedidos</a>
        <a href="/admin/mensajes.html">💬 Mensajes</a>
        <a href="/admin/artista.html">👩‍🎨 Sobre Cristina</a>
        <a href="/" target="_blank">🌐 Ver web pública ↗</a>
      </nav>
      <button class="admin-side__logout" id="logout">Cerrar sesión</button>
    </aside>

    <main class="admin-main">
      <h1 class="admin-title">Pedidos</h1>
      <p class="admin-sub">Consulta y actualiza el estado de los pedidos.</p>

      <!-- Filtros -->
      <div class="filters" id="filters">
        <button class="filter-btn active" data-status="">Todos</button>
        <button class="filter-btn" data-status="pending">Pendientes</button>
        <button class="filter-btn" data-status="paid">Pagados</button>
        <button class="filter-btn" data-status="shipped">Enviados</button>
        <button class="filter-btn" data-status="delivered">Entregados</button>
        <button class="filter-btn" data-status="cancelled">Cancelados</button>
      </div>

      <!-- Tabla -->
      <div id="tabla-container">
        <div class="empty">Cargando pedidos…</div>
      </div>
    </main>
  </div>

  <script type="module" src="/admin/js/pedidos-admin.js"></script>
</body>
</html>
