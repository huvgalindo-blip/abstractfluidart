<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Categorías · Admin · AbstractFluidArt</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />

  <style>
    body { background: #f5f3ef; }
    .admin-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .admin-side { background: #1a1a1a; color: #e5e0d8; padding: 2rem 1.2rem; }
    .admin-side__brand { font-family: var(--font-display); font-size: 1.4rem; font-weight: 600; color: #faf7f2; margin-bottom: 0.2rem; }
    .admin-side__sub { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; color: #c2410c; margin-bottom: 2rem; }
    .admin-side__nav { display: grid; gap: 0.3rem; }
    .admin-side__nav a { display: block; padding: 0.65rem 0.9rem; border-radius: 8px; font-size: 0.9rem; color: #d4cec4; }
    .admin-side__nav a:hover { background: #2a2a2a; color: #fff; }
    .admin-side__nav a.active { background: #c2410c; color: #fff; font-weight: 600; }
    .admin-side__logout { margin-top: 2rem; font-size: 0.85rem; color: #9b9489; cursor: pointer; background: none; border: none; padding: 0; }

    .admin-main { padding: 2.5rem; max-width: 1100px; }
    .admin-title { font-family: var(--font-display); font-size: 2rem; margin: 0 0 0.3rem; }
    .admin-sub { color: var(--color-muted); margin-bottom: 2rem; font-size: 0.95rem; }

    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; gap: 1rem; flex-wrap: wrap; }
    .btn-primary {
      background: #c2410c; color: #fff; border: none;
      padding: 0.75rem 1.3rem; border-radius: 8px; font-weight: 600;
      cursor: pointer; font-size: 0.9rem;
    }
    .btn-primary:hover { background: #9a330a; }
    .btn-secondary {
      background: transparent; border: 1px solid #e5e0d8; color: var(--color-ink);
      padding: 0.7rem 1.3rem; border-radius: 8px; font-weight: 600;
      cursor: pointer; font-size: 0.9rem; text-decoration: none; display: inline-block;
    }
    .btn-secondary:hover { background: #efece5; }

    /* Formulario inline */
    .cat-form {
      background: #fff; border-radius: 12px; padding: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
      margin-bottom: 2rem;
      display: none;
    }
    .cat-form.is-open { display: block; }
    .cat-form h2 { font-family: var(--font-display); font-size: 1.3rem; margin: 0 0 1.2rem; }
    .cat-form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .cat-form .field { margin-bottom: 0; }
    .cat-form .field.full { grid-column: 1 / -1; }
    .cat-form label { display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.35rem; }
    .cat-form input[type=text],
    .cat-form input[type=number],
    .cat-form textarea {
      width: 100%; padding: 0.7rem 0.9rem; border: 1px solid #e5e0d8;
      border-radius: 8px; font-size: 0.95rem; font-family: inherit; min-height: 42px;
    }
    .cat-form textarea { min-height: 70px; resize: vertical; }
    .cat-form .actions { display: flex; gap: 0.6rem; justify-content: flex-end; margin-top: 1.2rem; }

    /* Tabla */
    .cat-table {
      width: 100%; background: #fff; border-radius: 12px; overflow: hidden;
      border-collapse: collapse; box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .cat-table th, .cat-table td {
      text-align: left; padding: 0.9rem 1.1rem;
      border-bottom: 1px solid #efece5; font-size: 0.9rem; vertical-align: top;
    }
    .cat-table th {
      background: #f9f7f3; font-size: 0.75rem; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--color-muted); font-weight: 600;
    }
    .cat-table tr:last-child td { border-bottom: none; }
    .cat-table tr:hover td { background: #fcfbf8; }
    .cat-table code {
      background: #f5f3ef; padding: 0.1rem 0.4rem;
      border-radius: 4px; font-size: 0.8rem; color: #c2410c;
    }
    .cat-actions { display: flex; gap: 0.4rem; }
    .icon-btn {
      width: 34px; height: 34px; display: inline-flex; align-items: center;
      justify-content: center; border-radius: 8px; border: 1px solid #e5e0d8;
      background: #fff; cursor: pointer; font-size: 1rem;
    }
    .icon-btn:hover { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .count-pill {
      display: inline-block; padding: 0.15rem 0.5rem;
      background: #f5f3ef; border-radius: 999px;
      font-size: 0.75rem; font-weight: 600; color: var(--color-muted);
    }

    .empty { background: #fff; border-radius: 12px; padding: 3rem; text-align: center; color: var(--color-muted); }

    @media (max-width: 900px) {
      .admin-shell { grid-template-columns: 1fr; }
      .admin-side { padding: 1.2rem; }
      .admin-main { padding: 1.5rem; }
      .cat-form-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-side">
      <div class="admin-side__brand">AbstractFluidArt</div>
      <div class="admin-side__sub">Admin</div>
      <nav class="admin-side__nav">
        <a href="/admin/dashboard.html">🏠 Dashboard</a>
        <a href="/admin/obras.html">🖼️ Obras</a>
        <a href="/admin/categorias.html" class="active">📂 Categorías</a>
        <a href="/admin/pedidos.html">📦 Pedidos</a>
        <a href="/admin/mensajes.html">💬 Mensajes</a>
        <a href="/admin/artista.html">👩‍🎨 Sobre Cristina</a>
        <a href="/" target="_blank">🌐 Ver web pública ↗</a>
      </nav>
      <button class="admin-side__logout" id="logout">Cerrar sesión</button>
    </aside>

    <main class="admin-main">
      <h1 class="admin-title">Categorías</h1>
      <p class="admin-sub">Organiza las obras por tipo (original, monotipo, lámina, etc.).</p>

      <div class="toolbar">
        <div></div>
        <button class="btn-primary" id="btn-new">+ Nueva categoría</button>
      </div>

      <!-- Formulario inline (oculto por defecto) -->
      <form class="cat-form" id="cat-form">
        <h2 id="cat-form-title">Nueva categoría</h2>
        <input type="hidden" id="cat-id">

        <div class="cat-form-grid">
          <div class="field">
            <label for="cat-name">Nombre <span style="color:#c2410c">*</span></label>
            <input type="text" id="cat-name" required placeholder="Ej: Lámina impresa">
          </div>

          <div class="field">
            <label for="cat-slug">Slug (URL) <span style="color:#c2410c">*</span></label>
            <input type="text" id="cat-slug" required placeholder="Ej: lamina-impresa">
            <div style="font-size:0.75rem;color:var(--color-muted);margin-top:0.3rem">
              Solo minúsculas, números y guiones.
            </div>
          </div>

          <div class="field full">
            <label for="cat-description">Descripción</label>
            <textarea id="cat-description" placeholder="Texto que se mostrará junto a la categoría..."></textarea>
          </div>

          <div class="field">
            <label for="cat-sort">Orden</label>
            <input type="number" id="cat-sort" value="0" min="0" step="1">
          </div>

          <div class="field">
            <label style="display:flex;align-items:center;gap:0.5rem;text-transform:none;letter-spacing:normal;font-weight:500;font-size:0.9rem;margin-top:1.6rem">
              <input type="checkbox" id="cat-visible" checked style="width:18px;height:18px;accent-color:#c2410c">
              Visible en la web
            </label>
          </div>
        </div>

        <div class="actions">
          <button type="button" class="btn-secondary" id="btn-cancel">Cancelar</button>
          <button type="submit" class="btn-primary" id="btn-save">Guardar</button>
        </div>
      </form>

      <!-- Tabla -->
      <div id="tabla-container">
        <div class="empty">Cargando categorías…</div>
      </div>
    </main>
  </div>

  <script type="module" src="/admin/js/categorias-admin.js"></script>
</body>
</html>
