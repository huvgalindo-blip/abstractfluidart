<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin · AbstractFluidArt</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />

  <style>
    /* Estilos específicos del login */
    .login-wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1rem;
      background: var(--color-bg);
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      background: #ffffff;
      border-radius: var(--radius);
      padding: 2.5rem 2rem;
      box-shadow: var(--shadow);
    }
    .login-card h1 {
      font-size: 1.8rem;
      margin-bottom: 0.3rem;
    }
    .login-card p {
      color: var(--color-muted);
      font-size: 0.9rem;
      margin-bottom: 2rem;
    }
    .login-card label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      color: var(--color-ink);
    }
    .login-card input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 1px solid var(--color-line);
      border-radius: var(--radius);
      margin-bottom: 1.2rem;
      font-size: 1rem;
      min-height: 44px;
    }
    .login-card input:focus {
      outline: 2px solid var(--color-accent);
      outline-offset: 1px;
    }
    .login-card .btn {
      width: 100%;
      min-height: 44px;
    }
    .login-error {
      color: #b91c1c;
      font-size: 0.85rem;
      margin-top: 0.5rem;
      min-height: 1.2em;
    }
    .login-back {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
      color: var(--color-muted);
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <form class="login-card" id="login-form">
      <h1>Admin</h1>
      <p>Acceso para la artista y administración.</p>

      <label for="user">Usuario</label>
      <input id="user" name="user" type="text" required autocomplete="username">

      <label for="pass">Contraseña</label>
      <input id="pass" name="pass" type="password" required autocomplete="current-password">

      <button class="btn btn--primary" type="submit">Entrar</button>

      <div class="login-error" id="error"></div>

      <a class="login-back" href="/">← Volver a la web</a>
    </form>
  </div>

  <script type="module">
    // Comprobamos si ya hay sesión al cargar la página
    try {
      const me = await fetch('/api/admin/me').then(r => r.json());
      if (me.admin) location.href = '/admin/dashboard.html';
    } catch (_) { /* sin sesión */ }

    // Formulario de login
    const form = document.getElementById('login-form');
    const errorEl = document.getElementById('error');
    const submitBtn = form.querySelector('button[type=submit]');

    form.onsubmit = async (e) => {
      e.preventDefault();
      errorEl.textContent = '';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Entrando…';

      const data = Object.fromEntries(new FormData(form));

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const json = await res.json().catch(() => ({}));

        if (!res.ok) {
          errorEl.textContent = json.error || 'Credenciales incorrectas';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Entrar';
          return;
        }

        location.href = '/admin/dashboard.html';
      } catch (err) {
        errorEl.textContent = 'Error de conexión. Inténtalo de nuevo.';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Entrar';
      }
    };
  </script>
</body>
</html>
