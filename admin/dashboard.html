<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard · Admin · AbstractFluidArt</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />

  <style>
    body { background: #f5f3ef; }

    .admin-shell {
      display: grid;
      grid-template-columns: 240px 1fr;
      min-height: 100vh;
    }

    /* --- Sidebar --- */
    .admin-side {
      background: #1a1a1a;
      color: #e5e0d8;
      padding: 2rem 1.2rem;
    }
    .admin-side__brand {
      font-family: var(--font-display);
      font-size: 1.4rem;
      font-weight: 600;
      color: #faf7f2;
      margin-bottom: 0.2rem;
    }
    .admin-side__sub {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: #c2410c;
      margin-bottom: 2rem;
    }
    .admin-side__nav { display: grid; gap: 0.3rem; }
    .admin-side__nav a {
      display: block;
      padding: 0.65rem 0.9rem;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #d4cec4;
      transition: background 0.15s;
    }
    .admin-side__nav a:hover { background: #2a2a2a; color: #fff; }
    .admin-side__nav a.active { background: #c2410c; color: #fff; font-weight: 600; }
    .admin-side__logout {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #9b9489;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }
    .admin-side__logout:hover { color: #c2410c; }

    /* --- Main --- */
    .admin-main {
      padding: 2.5rem 2.5rem 4rem;
      max-width: 1200px;
    }
    .admin-title {
      font-family: var(--font-display);
      font-size: 2rem;
      margin: 0 0 0.3rem;
    }
    .admin-sub {
      color: var(--color-muted);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    /* --- KPI cards --- */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    .kpi-card {
      background: #fff;
      border-radius: 12px;
      padding: 1.4rem 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
    }
    .kpi-card__label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    .kpi-card__value {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 600;
      line-height: 1;
      color: var(--color-ink);
    }
    .kpi-card__hint {
      font-size: 0.8rem;
      color: var(--color-muted);
      margin-top: 0.4rem;
    }

    /* --- Quick actions --- */
    .quick {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      margin-bottom: 2.5rem;
    }
    .quick a {
      display: inline-block;
      padding: 0.7rem 1.2rem;
      background: #fff;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--color-ink);
      border: 1px solid #e5e0d8;
      transition: all 0.15s;
    }
    .quick a:hover { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

    /* --- Tabla --- */
    .admin-table {
      width: 100%;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
      border-collapse: collapse;
    }
    .admin-table th, .admin-table td {
      text-align: left;
      padding: 0.9rem 1.1rem;
      border-bottom: 1px solid #efece5;
      font-size: 0.9rem;
    }
    .admin-table th {
      background: #f9f7f3;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--color-muted);
      font-weight: 600;
    }
    .admin-table tr:last-child td { border-bottom: none; }
    .admin-table tr:hover td { background: #fcfbf8; }
    .status-pill {
      display: inline-block;
      padding: 0.2rem 0.65rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .status-pending   { background: #fef3c7; color: #92400e; }
    .status-paid      { background: #dcfce7; color: #166534; }
    .status-shipped   { background: #dbeafe; color: #1e40af; }
    .status-delivered { background: #e0e7ff; color: #3730a3; }
    .status-cancelled { background: #fee2e2; color: #991b1b; }

    .empty {
      background: #fff;
      border-radius: 12px;
      padding: 3rem;
      text-align: center;
      color: var(--color-muted);
    }

    @media (max-width: 800px) {
      .admin-shell { grid-template-columns: 1fr; }
      .admin-side { padding: 1.2rem; }
      .admin-main { padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <!-- Sidebar -->
    <aside class="admin-side">
      <div class="admin-side__brand">AbstractFluidArt</div>
      <div class="admin-side__sub">Admin</div>

      <nav class="admin-side__nav">
        <a href="/admin/dashboard.html" class="active">🏠 Dashboard</a>
        <a href="/admin/obras.html">🖼️ Obras</a>
        <a href="/admin/categorias.html">📂 Categorías</a>
        <a href="/admin/pedidos.html">📦 Pedidos</a>
        <a href="/admin/mensajes.html">💬 Mensajes</a>
        <a href="/admin/artista.html">👩‍🎨 Sobre Cristina</a>
        <a href="/" target="_blank">🌐 Ver web pública ↗</a>
      </nav>

      <button class="admin-side__logout" id="logout">Cerrar sesión</button>
    </aside>

    <!-- Main -->
    <main class="admin-main">
      <h1 class="admin-title">Hola, Cristina 👋</h1>
      <p class="admin-sub" id="today">Este es el resumen de hoy.</p>

      <!-- KPIs -->
      <div class="kpi-grid" id="kpis">
        <div class="kpi-card">
          <div class="kpi-card__label">Cargando…</div>
          <div class="kpi-card__value">—</div>
        </div>
      </div>

      <!-- Accesos rápidos -->
      <div class="quick">
        <a href="/admin/obras.html">+ Nueva obra</a>
        <a href="/admin/pedidos.html">Ver pedidos</a>
        <a href="/admin/categorias.html">Categorías</a>
        <a href="/admin/mensajes.html">Mensajes</a>
      </div>

      <!-- Últimos pedidos -->
      <h2 style="font-family: var(--font-display); font-size: 1.4rem; margin-bottom: 1rem;">Últimos pedidos</h2>
      <div id="ultimos-pedidos">
        <div class="empty">Cargando…</div>
      </div>
    </main>
  </div>

  <script type="module">
    import { adminApi, requireSession, euros, formatDate, toast } from './js/admin-api.js';

    // 1) Comprobar sesión
    if (!(await requireSession())) throw new Error('Sin sesión');

    // 2) Fecha de hoy
    document.getElementById('today').textContent =
      new Date().toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

    // 3) Logout
    document.getElementById('logout').onclick = async () => {
      await adminApi.logout();
      location.href = '/admin/index.html';
    };

    // 4) Cargar KPIs
    try {
      const s = await adminApi.stats();

      const kpis = [
        { label: 'Visitas hoy',          value: s.visits_today,          hint: 'Páginas vistas' },
        { label: 'Pedidos pendientes',   value: s.pending_orders,        hint: 'Esperando pago/envío' },
        { label: 'Ingresos del mes',     value: euros(s.revenue_month_cents), hint: 'Pedidos pagados' },
        { label: 'Obras publicadas',     value: s.published_artworks,    hint: `de ${s.total_artworks} en total` },
      ];

      document.getElementById('kpis').innerHTML = kpis.map(k => `
        <div class="kpi-card">
          <div class="kpi-card__label">${k.label}</div>
          <div class="kpi-card__value">${k.value}</div>
          <div class="kpi-card__hint">${k.hint}</div>
        </div>
      `).join('');
    } catch (err) {
      console.error(err);
      toast('Error cargando KPIs', 'err');
    }

    // 5) Últimos pedidos
    try {
      const orders = await adminApi.getOrders();
      const ultimos = orders.slice(0, 5);

      if (!ultimos.length) {
        document.getElementById('ultimos-pedidos').innerHTML =
          '<div class="empty">Aún no hay pedidos registrados.</div>';
      } else {
        document.getElementById('ultimos-pedidos').innerHTML = `
          <table class="admin-table">
            <thead>
              <tr>
                <th>Referencia</th>
                <th>Cliente</th>
                <th>Método</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Fecha</th>
              </tr>
            </thead>
            <tbody>
              ${ultimos.map(o => `
                <tr>
                  <td><strong>${o.reference}</strong></td>
                  <td>${o.customer_name || '—'}<br><span style="color:var(--color-muted);font-size:.8rem">${o.customer_email}</span></td>
                  <td>${o.payment_method || '—'}</td>
                  <td>${euros(o.total_cents)}</td>
                  <td><span class="status-pill status-${o.status}">${o.status}</span></td>
                  <td style="color:var(--color-muted);font-size:.85rem">${formatDate(o.created_at)}</td>
                </tr>`).join('')}
            </tbody>
          </table>`;
      }
    } catch (err) {
      console.error(err);
      toast('Error cargando pedidos', 'err');
    }
  </script>
</body>
</html>
