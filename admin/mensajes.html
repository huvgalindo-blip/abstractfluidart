<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mensajes · Admin · AbstractFluidArt</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/layout.css" />
  <link rel="stylesheet" href="/css/components.css" />

  <style>
    body { background: #f5f3ef; }
    .admin-shell { display: grid; grid-template-columns: 240px 1fr; min-height: 100vh; }
    .admin-side { background: #1a1a1a; color: #e5e0d8; padding: 2rem 1.2rem; }
    .admin-side__brand { font-family: var(--font-display); font-size: 1.4rem; font-weight: 600; color: #faf7f2; margin-bottom: 0.2rem; }
    .admin-side__sub { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.15em; color: #c2410c; margin-bottom: 2rem; }
    .admin-side__nav { display: grid; gap: 0.3rem; }
    .admin-side__nav a { display: block; padding: 0.65rem 0.9rem; border-radius: 8px; font-size: 0.9rem; color: #d4cec4; }
    .admin-side__nav a:hover { background: #2a2a2a; color: #fff; }
    .admin-side__nav a.active { background: #c2410c; color: #fff; font-weight: 600; }
    .admin-side__logout { margin-top: 2rem; font-size: 0.85rem; color: #9b9489; cursor: pointer; background: none; border: none; padding: 0; }

    .admin-main { padding: 2.5rem; max-width: 1000px; }
    .admin-title { font-family: var(--font-display); font-size: 2rem; margin: 0 0 0.3rem; }
    .admin-sub { color: var(--color-muted); margin-bottom: 2rem; font-size: 0.95rem; }

    /* Filtros */
    .filters { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    .filter-btn {
      padding: 0.55rem 1rem; border-radius: 999px;
      border: 1px solid #e5e0d8; background: #fff;
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }
    .filter-btn:hover { background: #efece5; }
    .filter-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }

    /* Lista */
    .msg-list { display: grid; gap: 0.7rem; }
    .msg-card {
      background: #fff; border-radius: 10px; padding: 1.1rem 1.3rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.04);
      border-left: 4px solid #e5e0d8;
    }
    .msg-card.unread { border-left-color: #c2410c; background: #fefaf7; }
    .msg-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 1rem; cursor: pointer;
    }
    .msg-head h3 {
      margin: 0; font-family: var(--font-body); font-size: 0.95rem;
      font-weight: 600; color: var(--color-ink);
    }
    .msg-head .meta {
      font-size: 0.8rem; color: var(--color-muted); margin-top: 0.2rem;
    }
    .msg-head .date {
      font-size: 0.75rem; color: var(--color-muted); white-space: nowrap;
    }
    .msg-body {
      margin-top: 1rem; padding-top: 1rem;
      border-top: 1px solid #efece5;
      font-size: 0.9rem; line-height: 1.65;
      white-space: pre-wrap;
    }
    .msg-actions {
      display: flex; gap: 0.5rem; margin-top: 1rem; flex-wrap: wrap;
    }
    .msg-actions a,
    .msg-actions button {
      padding: 0.5rem 1rem; border-radius: 6px;
      border: 1px solid #e5e0d8; background: #fff;
      cursor: pointer; font-size: 0.85rem; font-weight: 600;
      text-decoration: none; color: var(--color-ink);
    }
    .msg-actions a:hover,
    .msg-actions button:hover { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
    .msg-actions button:disabled { opacity: 0.5; cursor: default; }

    .empty { background: #fff; border-radius: 12px; padding: 3rem; text-align: center; color: var(--color-muted); }

    @media (max-width: 900px) {
      .admin-shell { grid-template-columns: 1fr; }
      .admin-side { padding: 1.2rem; }
      .admin-main { padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="admin-shell">
    <aside class="admin-side">
      <div class="admin-side__brand">AbstractFluidArt</div>
      <div class="admin-side__sub">Admin</div>
      <nav class="admin-side__nav">
        <a href="/admin/dashboard.html">🏠 Dashboard</a>
        <a href="/admin/obras.html">🖼️ Obras</a>
        <a href="/admin/categorias.html">📂 Categorías</a>
        <a href="/admin/pedidos.html">📦 Pedidos</a>
        <a href="/admin/mensajes.html" class="active">💬 Mensajes</a>
        <a href="/admin/artista.html">👩‍🎨 Sobre Cristina</a>
        <a href="/" target="_blank">🌐 Ver web pública ↗</a>
      </nav>
      <button class="admin-side__logout" id="logout">Cerrar sesión</button>
    </aside>

    <main class="admin-main">
      <h1 class="admin-title">Mensajes</h1>
      <p class="admin-sub">Consultas recibidas desde el formulario de contacto.</p>

      <!-- Filtros -->
      <div class="filters" id="filters">
        <button class="filter-btn active" data-filter="">Todos</button>
        <button class="filter-btn" data-filter="unread">No leídos</button>
        <button class="filter-btn" data-filter="read">Leídos</button>
      </div>

      <!-- Lista -->
      <div class="msg-list" id="lista">
        <div class="empty">Cargando mensajes…</div>
      </div>
    </main>
  </div>

  <script type="module" src="/admin/js/mensajes-admin.js"></script>
</body>
</html>
